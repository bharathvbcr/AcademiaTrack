<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:* https://nominatim.openstreetmap.org https://timeapi.io https://universities.hipolabs.com https://logo.clearbit.com; img-src 'self' data: https://logo.clearbit.com; object-src 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcademiaTrack</title>
  <link rel="icon" href="AcademiaTrack.png">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AcademiaTrack - Academic Application Tracker" />
  <meta property="og:description" content="Track and manage universities, deadlines, documents, faculty, and budgets in a sleek, desktop-first dashboard." />
  <meta property="og:image" content="/social-preview.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AcademiaTrack - Academic Application Tracker" />
  <meta name="twitter:description" content="Track and manage universities, deadlines, documents, faculty, and budgets in a sleek, desktop-first dashboard." />
  <meta name="twitter:image" content="/social-preview.png" />
  <!-- Fonts are self-hosted (imported in index.tsx) so they load offline without a CDN. -->
  <style>
    :root {
      /* ── Minimal Dark Palette — single source of truth ──
         Zinc surfaces + red accent. Components hardcode these same hex values
         (e.g. text-[#f4f4f5], bg-[#18181b], text-[#dc2626]); the variables below
         back the shared utility classes and the global focus ring. */
      --bg-base: #09090b;        /* zinc 950 — app background   */
      --bg-card: #18181b;        /* zinc 900 — cards / surfaces  */
      --bg-card-hover: #27272a;  /* zinc 800 — hover / raised    */
      --border-color: #27272a;   /* zinc 800 — hairline borders  */

      --text-primary: #f4f4f5;   /* zinc 100 — primary text      */
      --text-secondary: #a1a1aa; /* zinc 400 — secondary text    */
      --text-muted: #71717a;     /* zinc 500 — muted / hints     */

      --accent-primary: #dc2626; /* red 600 — primary accent     */
      --accent-hover: #b91c1c;   /* red 700 — accent hover       */
      --accent-subtle: rgba(220, 38, 38, 0.1);

      --radius-card: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: bottom;
    }

    /* Global focus ring — consistent, high-contrast, accent-coloured. */
    *:focus-visible {
      outline: 2px solid var(--accent-primary) !important;
      outline-offset: 2px !important;
      box-shadow: none !important;
    }

    /* ── Shared surface utilities (solid, flat — no glass effects) ── */
    .liquid-glass {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .liquid-glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .liquid-glass-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-color);
    }

    .liquid-glass-nav {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    .liquid-glass-modal {
      background: rgba(9, 9, 11, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .liquid-glass-modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
    }

    /* Custom Scrollbar — minimal */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 20px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: var(--text-secondary);
    }

    /* ── Reduced motion ── honour the OS preference: drop transitions,
       animations, and framer-motion transforms for users who ask for it. */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

</head>

<body class="transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
